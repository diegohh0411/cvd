[package]
name = "cvd-core"
version = "0.2.2"
description = "CV Decisions business logic, independent of any front end"
authors = ["Diego Hernández Herrera"]
license-file = "../../LICENSE"
edition = "2021"

[lib]
name = "cvd_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["io-std", "macros", "net", "rt", "sync", "time"] }
thiserror = "2"
sha2 = "0.11.0"
sysinfo = "0.39.6"
hf-hub = { version = "0.4", features = ["tokio"] }
async-trait = "0.1.92"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio-util = "0.7.19"
typst-as-lib = "0.17"
typst-pdf = "0.15"
typst = "0.15"
typst-layout = "0.15"
base64 = "0.22"
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros"] }
schemars = "1"
dirs = "7.0.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
agentix = "=0.31.0"
dom_smoothie = "0.18"
html2text = "0.17"
futures = "0.3.34"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = "0.26.6"
webpki-roots = "1.0.9"
mailparse = "0.18.0"
rustls = "0.23.45"

[features]
# Opt-in test against the real llama-server: needs CVD_TEST_MODEL and binaries/.
it-sidecar = []

[dev-dependencies]
pdf-extract = "0.12.1"
tempfile = "3.27.0"
wiremock = "0.6.5"
