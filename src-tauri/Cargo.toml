[package]
name = "cvd"
version = "0.2.4"
description = "A Tauri App"
authors = ["Diego Hernández Herrera"]
license-file = "../LICENSE"
edition = "2021"
default-run = "cvd"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cvd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cvd-mcp"
path = "src/bin/cvd-mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["io-std", "macros", "net", "rt", "sync", "time"] }
thiserror = "2"
sha2 = "0.11.0"
sysinfo = "0.39.6"
hf-hub = { version = "0.4", features = ["tokio"] }
async-trait = "0.1.92"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio-util = "0.7.19"
typst-as-lib = "0.17"
typst-pdf = "0.15"
typst = "0.15"
typst-layout = "0.15"
base64 = "0.22"
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros"] }
schemars = "1"
dirs = "7.0.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
agentix = "=0.31.0"
dom_smoothie = "0.18"
html2text = "0.17"
futures = "0.3.34"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = "0.26.6"
webpki-roots = "1.0.9"
mailparse = "0.18.0"
rustls = "0.23.45"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[features]
# Opt-in test against the real llama-server: needs CVD_TEST_MODEL and binaries/.
it-sidecar = []

[dev-dependencies]
pdf-extract = "0.12.1"
tempfile = "3.27.0"
wiremock = "0.6.5"
