[package]
name = "cvd-core"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[features]
postgres-tests = []

[dependencies]
uuid = { version = "1", features = ["v4"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "sqlite", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
tokio = { version = "1", features = ["io-std", "macros", "net", "rt", "sync", "time"] }
thiserror = "2"
async-trait = "0.1.92"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio-util = "0.7.19"
typst-as-lib = "0.17"
typst-pdf = "0.15"
typst = "0.15"
typst-layout = "0.15"
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
agentix = "=0.31.0"
dom_smoothie = "0.18"
html2text = "0.17"
futures = "0.3.34"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = "0.26.6"
webpki-roots = "1.0.9"
mailparse = "0.18.0"
rustls = "0.23.45"
nucleo-matcher = "0.3.1"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }


[dev-dependencies]
pdf-extract = "0.12.1"
tempfile = "3.27.0"
wiremock = "0.6.5"
tokio = { version = "1", features = ["test-util", "macros", "rt"] }
